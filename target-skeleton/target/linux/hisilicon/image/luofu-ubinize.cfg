# SPDX-License-Identifier: GPL-2.0-only
#
# ubinize config for the luofu R116 rootfs slot (target/linux/hisilicon/image)
#
# TWO volumes, matching the shape the stock vendor rootfs already uses on
# rootfsa/rootfsb and the standard OpenWrt squashfs+UBI layout
# (TARGET-DESIGN.md 3.3, 5.1, 5.3; FLASH-PLAN.md 0.1):
#
#   [squashfs]      static  vol_id 0   the read-only rootfs (the payload)
#   [rootfs_data]   dynamic vol_id 1   the persistent overlay, EMPTY in the
#                                      image and created by the kernel on the
#                                      first read-write mount (see below)
#
# The flash geometry is NOT in this file: it is passed on the ubinize command
# line from image/luofu.mk, because ubinize's ini format has no geometry keys:
#
#   -p 131072   PEB size            (0x20000, 128 KiB erase block)
#   -m 2048     min I/O size        (2 KiB page)
#   -s 2048     subpage size        (2 KiB)
#   -O 2048     VID header offset   (page after the EC header)
#
# @ROOTFS@ is substituted by tools/luofu-image.py with the squashfs path from
# the OpenWrt rootfs build. It must stay a placeholder: hardcoding a build path
# here would silently use a stale file.
#
# WHY rootfs_data IS EMPTY AND DYNAMIC (it must NOT be pre-formatted):
#   OpenWrt's mount_root (fstools libfstools/ubi.c) finds the UBI volume named
#   "rootfs_data", identifies it as UBIFS and calls mount("/dev/ubiN_1", ...,
#   "ubifs", MS_NOATIME). The kernel's UBIFS mount path explicitly supports an
#   EMPTY UBI volume: fs/ubifs/sb.c ubifs_read_superblock() calls
#   create_default_filesystem() when the volume is empty, i.e. the first
#   read-write mount formats it. vol_size=1MiB is the standard OpenWrt
#   reservation (scripts/ubinize-image.sh); vol_flags=autoresize makes the
#   kernel grow the volume to all free PEBs of the slot at attach, so the
#   overlay ends up with the whole unused part of the 24 MiB rootfs slot.
#   A pre-built UBIFS image here would NOT be used by this build (no
#   mkfs.ubifs step) and is unnecessary: do not add image= here.
#
# STATUS: HOST-BUILD VALIDATED (empty volume, static squashfs volume, slot
# budget) / NEVER BOOTED WITH THIS LAYOUT. TARGET-DESIGN.md 5.3 records the
# design change from the vendor's separate JFFS2 mtd15 partition.

[squashfs]
mode=ubi
image=@ROOTFS@
vol_id=0
vol_type=static
vol_name=squashfs

[rootfs_data]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs_data
vol_size=1MiB
vol_flags=autoresize
