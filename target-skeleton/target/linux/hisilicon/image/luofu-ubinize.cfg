#
# ubinize config for the luofu R116 rootfs slot (target/linux/hisilicon/image)
#
# One static squashfs volume named "squashfs", which is the shape the stock
# vendor rootfs already uses on rootfsa/rootfsb (TARGET-DESIGN.md 3.3, 5.1,
# 5.3; FLASH-PLAN.md 0.1). The flash geometry is NOT in this file: it is passed
# on the ubinize command line from image/luofu.mk, because ubinize's ini format
# has no geometry keys:
#
#   -p 131072   PEB size            (0x20000, 128 KiB erase block)
#   -m 2048     min I/O size        (2 KiB page)
#   -s 2048     subpage size        (2 KiB)
#   -O 2048     VID header offset   (page after the EC header)
#
# @ROOTFS@ is substituted by tools/luofu-image.py with the squashfs path from
# the OpenWrt rootfs build. It must stay a placeholder: hardcoding a build path
# here would silently use a stale file.
#
# STATUS: SCHEMATIC / UNTESTED TARGET. The geometry is from the measured bench
# layout; the volume shape is not yet boot-proven (no rootfs has booted).

[squashfs]
mode=ubi
image=@ROOTFS@
vol_id=0
vol_type=static
vol_name=squashfs
