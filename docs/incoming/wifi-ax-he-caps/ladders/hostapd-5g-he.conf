# hostapd-5g-he.conf - 5 GHz OPEN HE (802.11ax) AP fixture for AX-1 Rung B
# (lane wifi-ax-he-caps).  Only usable after the 5G-4 beaconing rung passes;
# channel 36 (non-DFS), HT20/VHT-agnostic, HE enabled.
driver=nl80211
interface=wlan5
ssid=cudy-ap-test-5g
hw_mode=a
channel=36
beacon_int=100
dtim_period=2
max_num_sta=4
ieee80211n=1
ieee80211ax=1
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
