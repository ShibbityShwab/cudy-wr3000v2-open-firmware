# hostapd-2g-he.conf - 2.4 GHz OPEN HE (802.11ax) AP fixture for AX-1
# (lane wifi-ax-he-caps FIRE-RECIPE G6).  Minimal HE: HT20 channel 6, no WPA
# (so the HE beacon rung does not depend on the key path), ieee80211ax=1 is
# the new variable.  SSID matches the observer lane's expected AP.
driver=nl80211
interface=wlan0
ssid=cudy-ap-test
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4
ieee80211n=1
ieee80211ax=1
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
