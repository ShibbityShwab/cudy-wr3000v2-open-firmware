# hostapd-dfs.conf - 5 GHz DFS AP on ch52 (5260 MHz), FIRST DFS rung, OPEN.
# Lane wifi-5g-160-dfs (task-205). HOST-ONLY fixture; the Lead deploys.
#
# GATE: the 5 GHz band-1 MAC start (H2D key 0x0242) must be bench-proven
# (observer sees the 5 GHz SSID) before this fixture is used. The driver must
# be loaded with band5g=1 vap5g=1 desc_table=1 dfs_mode=1 ap_chan_wait_ms=300
# and the dfs_cac=1 patch (HOST-IMPLEMENTATION.md B1); unpatched, hostapd's
# radar-detect request has no cfg80211 op and the CAC cannot start.
#
# US/DFS-FCC: country_code=US + ieee80211d=1; the project cfg80211 must be
# the fixed one (wifi-regdom-fix lane) or the regdb rejects US and the DFS
# channels are not usable. 60 s CAC on ch52 (FCC UNII-2A); hostapd asks the
# driver to run the CAC and only enables the AP after CAC finished.
#
# The driver runs the vendor CAC: H2D 0x07E7 {01} start, 60 s host timer,
# 0x07E7 {00} stop, cfg80211_cac_event(FINISHED). A radar hit would be a
# D2H event -> cfg80211_cac_event(DETECTED) -> hostapd channel switch; the
# radar D2H path is not wired yet, so this fixture is the CAC-only rung.

interface=wlan5
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=cudy-ap-test-5g-dfs
hw_mode=a
channel=52
beacon_int=100
dtim_period=2
max_num_sta=4

# 802.11h/DFS: the stock OpenWrt hostapd.sh sets ieee80211h=1 for hw_mode=a
# with 802.11h enabled; the direct hostapd fixture states it explicitly.
ieee80211h=1
ieee80211d=1
country_code=US
country3=0x20

ieee80211n=1
ieee80211ac=1
vht_oper_chwidth=0
vht_oper_centr_freq_seg0_idx=0

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
