# hostapd-160.conf - 5 GHz VHT160 AP on ch36 (CCFS1 = ch50), OPEN.
# Lane wifi-5g-160-dfs (task-205). HOST-ONLY fixture; the Lead deploys.
#
# GATE: the 5 GHz band-1 MAC start (H2D key 0x0242) must be bench-proven
# (observer sees the 5 GHz SSID) before this fixture is used. The driver must
# be loaded with band5g=1 vap5g=1 desc_table=1 dfs_mode=1 ap_chan_wait_ms=300
# and the ht_bw=1 patch (HOST-IMPLEMENTATION.md A1/A2); unpatched, the 0x0124
# body carries the 20 MHz selector and hostapd's chandef width is ignored by
# the firmware RF path (the AP may still start, but 160 is not programmed).
#
# The driver wiphy already advertises VHT cap 0x00400064 (160 MHz + SGI80/
# SGI160): no vht_capab override is needed when hostapd takes the driver caps.
# WIDTH: vht_oper_chwidth=2 (160 MHz), CCFS1 = channel 50 for the 36-64
# segment. CCFS2 (80+80) is 0: the vendor cap has no 80+80 bit, so this
# fixture must never be run as 80+80.
#
# NOTE: the 36-64 segment includes the DFS channels 52-64. For a clean
# 160 MHz rung after DFS is implemented use the 100-128 segment with
# channel=100 and vht_oper_centr_freq_seg0_idx=114 (see FIRE-RECIPES.md
# 160-2 note). This fixture is the capability rung.

interface=wlan5
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=cudy-ap-test-5g160
hw_mode=a
channel=36
beacon_int=100
dtim_period=2
max_num_sta=4

ieee80211n=1
ieee80211ac=1
vht_oper_chwidth=2
vht_oper_centr_freq_seg0_idx=50
vht_oper_centr_freq_seg1_idx=0

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
