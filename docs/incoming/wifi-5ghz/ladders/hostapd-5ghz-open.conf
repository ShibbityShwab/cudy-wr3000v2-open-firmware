# hostapd-5ghz-open.conf - wifi-5ghz lane (task-145), 5 GHz ch36, OPEN.
#
# HOST-ONLY SAMPLE for TEST-LADDER G3.  Open first rung: no add_key, no WPA,
# no 4-way - it isolates the 5 GHz band-enable + AP-start path.  Run on the
# 5 GHz wiphy's AP interface (see TEST-LADDER G1 for identifying the phy):
#
#   iw phy <5G-phy> interface add wlan5 type __ap
#   ip link set wlan5 up
#   /usr/sbin/hostapd -dd -t /tmp/hostapd-5ghz-open.conf
#
# No secret in this file.

interface=wlan5
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# 5 GHz, 20 MHz, non-DFS ch36 (192.168.10.0 bench; ch36 needs no CAC)
ssid=cudy-ap-test-5g
hw_mode=a
channel=36
beacon_int=100
dtim_period=2
max_num_sta=4

# First rung is legacy OFDM; HT/VHT caps are advertised by the band5g=1 wiphy
# profile but the first AP start stays 20 MHz/no-HT to isolate the band path.
# A later rung can add: ieee80211n=1 ht_capab=[SHORT-GI-20] and ieee80211ac=1
# vht_oper_chwidth=0 (advertise-only; width programming is out of scope here).
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
