# SPDX-License-Identifier: GPL-2.0
#
# hostapd-open.proven.conf - the HARDWARE-FIRED open-network AP fixture.
#
# This is the fixture that produced the 2026-11-27 hostapd AP-ENABLED
# milestone on the self-contained image; the FINAL all-patch module keeps the
# same open path (the single-boot validation reached AP-ENABLED with the
# vendor five-message order).  Keep it as the known-good baseline when
# bisecting a hostapd or driver change: no HT, no WMM-DSCP extras, no key
# management, no on-air claim.
#
# Proven: AP-ENABLED, AP-start frames consumed 0 polls, page/mask golden.
# NOT proven: beacons on air, association (needs an external client).

driver=nl80211
interface=wlan0

ssid=wr3000v2-apstart
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4

# open network: no wpa=/wpa_key_mgmt/rsn_pairwise lines
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
