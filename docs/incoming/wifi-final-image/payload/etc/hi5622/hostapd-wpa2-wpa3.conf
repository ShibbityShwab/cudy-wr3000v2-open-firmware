#
# hostapd-wpa2-wpa3.conf - WPA2+WPA3 transition AP fixture (READY, NOT
# FUNCTIONAL - DO NOT DEPLOY AS SECURITY).
#
# The WPA2 half is protocol-ready in the FINAL all-patch module (M3
# add_key/set_key present, GTK install hardware-proven).  This transition
# fixture additionally needs:
#   1. WPA3-SAE authentication => the management-frame TX/RX path (M4).  The
#      driver registers a fail-closed .mgmt_tx and has no mgmt RX, so SAE
#      cannot complete.
#   2. PMF (ieee80211w) needs mgmt RX to work.
# The dedicated WPA3-SAE/transition configs are the deliverable of the
# in-flight wifi-wpa3-sae lane (shared task-144); this file is the target
# shape and is parser-validated only.  It is NOT a claim of WPA3 support.
#
# Placeholder credentials only - never real PSKs.

driver=nl80211
interface=wlan0

ssid=cudy-wr3000v2-wpa23
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=16

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

ieee80211n=1
ht_capab=[HT20][SHORT-GI-20]

wpa=2
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
ieee80211w=1
sae_require_mfp=1
wpa_passphrase=CHANGEME-lab-only
wpa_group_rekey=600
