# SPDX-License-Identifier: GPL-2.0
#
# hostapd-wpa2-wpa3.conf - HARDENED WPA2+WPA3 transition AP config
# (READY, NOT FUNCTIONAL - DO NOT DEPLOY AS SECURITY).
#
# BLOCKERS (documented):
#   1. WPA2 (and therefore the PSK half of the transition) needs the M3
#      add_key/set_key ops: absent from struct cfg80211_ops today.
#   2. WPA3-SAE needs the M3 key install PLUS SAE authentication handling
#      (external auth / management-frame RX,TX path).  The driver registers a
#      fail-closed .mgmt_tx and has no management RX, so SAE cannot complete.
#
# The config is kept as the hardened target for the M3/M4 milestones and to
# document the intended output shape.  It is parser-validated only; it is not
# a claim of WPA3 support.  See HOSTAPD.md for the capability matrix.
#
# Placeholder credential only - never a real PSK.

driver=nl80211
interface=wlan0

ssid=cudy-wr3000v2-wpa23
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=16

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

ieee80211n=1
ht_capab=[HT20][SHORT-GI-20]

wpa=2
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
ieee80211w=1
sae_require_mfp=1
wpa_passphrase=CHANGEME-lab-only
wpa_group_rekey=600
