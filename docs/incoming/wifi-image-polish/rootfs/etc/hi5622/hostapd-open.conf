#
# hostapd-open.conf - HARDENED open-network AP (recommended deployment shape).
#
# Status: config-parser-validated with hostapd v2.12 from the same OpenWrt
# tree source; NOT yet hardware-fired in this exact form.  The hardware-fired
# baseline is hostapd-open.proven.conf.  Differences: SSID, HT20 block, and a
# larger station limit.  Driver capability notes (HOSTAPD.md):
#   * wiphy advertises an HT20-only skeleton (SGI20 + AMSDU); HT40 is NOT
#     advertised - do not add [HT40+]/[HT40-].
#   * channels 1..13 are advertised for 2.4 GHz; the image regdomain is the
#     unsigned-world db (NO_IR), so set a country before expecting beacons on
#     a real channel (hi5622.ap.country).
#   * OPEN AP is the only security class that does not need the M3 add_key op.
#     No on-air beacon/association claim: host-side AP-ENABLED only.
#   * beacon_int/dtim_period are hostapd parameters; with the current driver
#     the firmware beacon path is not host-observable (documented limit).

driver=nl80211
interface=wlan0

ssid=cudy-wr3000v2
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=16

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

# HT20 only (matches the driver wiphy ht_cap; HT40 is not advertised)
ieee80211n=1
ht_capab=[HT20][SHORT-GI-20]
