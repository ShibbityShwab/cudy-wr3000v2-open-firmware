# SPDX-License-Identifier: GPL-2.0
#
# hostapd-wpa2.conf - HARDENED WPA2-PSK/CCMP AP config (READY, NOT FUNCTIONAL).
#
# BLOCKER (documented, not a config bug): the driver's struct cfg80211_ops has
# no .add_key/.set_key op - they are M3 work - so the WPA2 4-way handshake
# cannot install the PTK/GTK.  hostapd gets as far as the AP-start frame
# sequence (start_ap -> 4 AP-start H2D frames) and then fails at key
# installation with -EOPNOTSUPP.  This config exists so the M3 milestone has a
# hardened target; it is NOT a working secured AP.  See HOSTAPD.md.
#
# When M3 lands: enable PMF with ieee80211w=1 (needs management-frame RX +
# key install; see the commented block) and re-run the AP-start ladder.
#
# Placeholder credential only - never a real PSK.  Never commit a real PSK.

driver=nl80211
interface=wlan0

ssid=cudy-wr3000v2-wpa2
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=16

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

# HT20 (driver wiphy: HT20-only skeleton; no HT40)
ieee80211n=1
ht_capab=[HT20][SHORT-GI-20]

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=CHANGEME-lab-only
wpa_group_rekey=600

# M3+: hardened PMF (do not enable before add_key/mgmt-RX exist)
#ieee80211w=1
