# SPDX-License-Identifier: GPL-2.0
#
# hostapd-open.proven.conf - the HARDWARE-FIRED open-network AP fixture.
#
# This file is byte-equivalent in meaning to the fixture that produced the
# 2026-11-27 hostapd AP-ENABLED milestone on the flashed self-contained image
# (ssid cudy-ap-test there; wr3000v2-apstart in the earlier fixture - the SSID
# is not a driver parameter).  Keep it as the known-good baseline when
# bisecting a hostapd or driver change: no HT, no WMM-DSCP extras, no key
# management, no on-air claim.
#
# Proven by: wifi-ap-start/REPORT.md + STATUS.md 3m (AP-ENABLED, 4 AP-start
# frames consumed in 0 polls, page/mask golden).  NOT proven: beacons on air,
# association (needs an external client).

driver=nl80211
interface=wlan0

ssid=wr3000v2-apstart
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4

# open network: no wpa=/wpa_key_mgmt/rsn_pairwise lines
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
