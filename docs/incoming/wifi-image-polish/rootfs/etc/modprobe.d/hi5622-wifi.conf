#
# /etc/modprobe.d/hi5622-wifi.conf - packaged defaults for the clean-room
# Hi5622V100 Wi-Fi driver on the Cudy WR3000 v2.0 image.
#
# IMPORTANT (bench-confirmed 2026-11-27): modprobe on this image does NOT pass
# command-line module parameters, and the proven load path is an explicit
# "insmod .../hi5622_wifi.ko <options>".  The shipped loader
# (/usr/sbin/hi5622-load) therefore uses insmod with these same values spelled
# out.  This file only makes a manual "modprobe hi5622_wifi" carry the packaged
# defaults (and mirrors the /etc/config/hi5622 settings - keep both in sync;
# tools/selftest.sh checks it).
#
# Do NOT add mgmt_diag here: the hardware-validated prebuilt module
# (242,572 B sha256 44c6cc12..., installed 231,132 B sha256 51608fd5...)
# does not expose it.  mgmt_diag exists only in the polished build
# (patches/0001-polish-module-defaults-and-mgmt-diag.patch) and defaults to 0.
#
# Load cfg80211 first:  modprobe cfg80211 && modprobe hi5622_wifi
options hi5622_wifi fw_path=hi_wifi/FIRMWARE.PD4.bin wifi_block_path=hi_wifi/wifi_block.bin allow_frames=16 frame_gap_ms=100 h2d_send_budget=4 vap_start_first=1 vap_start_mode=1 vap_start_module=0 scan_dwell_ms=60 hcc_poll_ms=5
