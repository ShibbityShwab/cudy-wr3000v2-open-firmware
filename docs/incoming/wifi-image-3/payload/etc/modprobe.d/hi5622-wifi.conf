# /etc/modprobe.d/hi5622-wifi.conf - packaged defaults for the clean-room
# Hi5622V100 Wi-Fi driver on the Cudy WR3000 v2.0 IMAGE #3.
#
# IMPORTANT (bench-confirmed 2026-11-27): modprobe on this image does NOT pass
# command-line module parameters, and the proven load path is an explicit
# "insmod .../hi5622_wifi.ko <options>".  The shipped loader
# (/usr/sbin/hi5622-load) therefore uses insmod with these same values spelled
# out.  This file only makes a manual "modprobe hi5622_wifi" carry the packaged
# defaults (and mirrors /etc/config/hi5622 settings - keep both in sync;
# tools/selftest.sh checks it).
#
# MODULE: IMAGE #3 merged build, 64 parameters, vermagic
# "6.18.60 SMP mod_unload ARMv7 p2v8", depends=cfg80211.
#   activity (strip --strip-debug): 379,092 B sha256
#     545192dfdd9110d0439418b159f4fc6b56af09e295a56bf179b4838b1d713b99
#   installed (/lib/modules/6.18.60/hi5622_wifi.ko): 358,544 B sha256
#     a717c86db2b974cfa4c5560648508cbb589f67b47393a48993ee8eb939321fed
# Chain: image #2's CORRECTED FINAL ASSOCIATION tree + mgmt-TX carrier +
# rx_refill_wm + the 5 GHz chain (band5g/vap5g/ap_chan_wait_ms/desc_table/
# dfs_mode + the F2 field-B fix) + he_caps (802.11ax) + the fail-closed BA
# skeleton (ba_enable).  Bench-proven constituents: the F2 fire programmed the
# 5 GHz RF; the HE AP is live with he_caps=1; the image-2 association chain was
# hardware-accepted.  The exact merged combination is NOT fired; new features
# are fail-closed at 0.
#
# The values are the single-boot hardware validation recipe
# (wifi-stability/FINAL-INTEGRATION.md section 4): allow_frames=32 /
# h2d_send_budget=10 are REQUIRED for the WPA2/RX rungs.  The association and
# 5 GHz/AX gates stay 0 (fail-closed) unless a fire sets them.
#
# Load cfg80211 first:  modprobe cfg80211 && modprobe hi5622_wifi
options hi5622_wifi fw_path=hi_wifi/FIRMWARE.PD4.bin wifi_block_path=hi_wifi/wifi_block.bin allow_frames=32 frame_gap_ms=100 h2d_send_budget=10 vap_start_first=1 vap_start_mode=1 vap_start_module=0 scan_dwell_ms=60 hcc_poll_ms=5 hcc_trace=0 stop_ap_mode=0 mgmt_diag=0 rx_enable=1 beacon_static=1 beacon_vap_start=1 wpa_keys=1 wpa_key_module=0 sta_join=0 ht_mode=0 vht_cap=0 band_vendor=0 scan_band_cfg=0 rx_refill_wm=75 mgmt_tx=0 mgmt_rx=0 sta_ops=0 eapol_rx=0 sta_user_del=0 data_tx=0 data_tx_peer=1 data_tx_protect=0 data_tx_timeout_ms=200 txq_publish=1 cfg80211_auto=1 ap_start_mode=0 rd_ab_write=0 hcc_cece_mode=0 allow_unseeded_release=0 band5g=0 vap5g=0 ap_chan_wait_ms=300 desc_table=0 dfs_mode=0 he_caps=0 ba_enable=0
