#
# hostapd-open-ax.conf - 2.4 GHz OPEN HE (802.11ax) AP fixture for IMAGE #3.
#
# PROVEN CLASS: the HE AP milestone (2026-11-27 04:00 and 09:00 re-verification)
# used the ax hostapd (fe f44f3b) + the HE-capable driver module (he_caps=1):
# the AP reached AP-ENABLED and the observer saw the HE Capabilities +
# HE Operation elements on air.  This fixture is the lane wifi-ax-he-caps
# 2.4 GHz ladder, SSID aligned with the proven fire (cudy-ap-test-he).
#
# REQUIREMENTS: load the driver with he_caps=1 (set hi5622.main.he_caps=1 in
# /etc/config/hi5622, then run hi5622-load), and set a country (ap.country=US).
# Without he_caps=1 the shipped hostapd refuses ieee80211ax=1 with
# "Driver does not support HE" (fail-closed).
driver=nl80211
interface=wlan0
ssid=cudy-ap-test-he
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4
ieee80211n=1
ieee80211ax=1
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
