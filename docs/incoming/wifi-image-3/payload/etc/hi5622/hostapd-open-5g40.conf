#
# hostapd-open-5g40.conf - 5 GHz OPEN AP fixture (channel 40 / 5200 MHz) for
# IMAGE #3.  This is the bench-proven F2 5 GHz AP shape (the 2026-11-27 23:30
# F2 fire: the 5 GHz RF was programmed, mode 3 on band 1, with the ch36-64 RF
# image; the AP reached AP-ENABLED on ch40, SSID cudy-ap-test-5g40).
#
# USE: the 5 GHz AP start needs the driver loaded with the F2 recipe
#   band5g=1 vap5g=1 desc_table=1 dfs_mode=1 ap_chan_wait_ms=300
# (hi5622.main.* in /etc/config/hi5622) and a country (ap.country=US).
# The loader's ap.ifname for a 5 GHz start is wlan5 (the second VAP endpoint).
# The 5 GHz BEACON TX itself is still gated on the firmware TBTT arm
# (fw-tbtt-arm lane): the RF programme is proven, the beacon emission is not.
# For a HE variant add "ieee80211ax=1" and load with he_caps=1.
driver=nl80211
interface=wlan5
ssid=cudy-ap-test-5g40
hw_mode=a
channel=40
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
beacon_int=100
dtim_period=2
auth_algs=1
