# hostapd-open.conf - phase A AP-start config (wifi-bench-session, task-127)
# 2.4 GHz ch 6, OPEN, beacon_int=100, dtim_period=2, WMM on.
# Derived byte-for-byte in intent from wifi-ap-start/recipes/hostapd-open.conf
# and hostapd-img (task-125) canonical facts: hostapd v2.12 always sends
# NL80211_CMD_SET_INTERFACE(AP); the VAP must already be created as __ap by
# device/ap-fire.sh.
#
# Contract: hostapd -B -i wlan0 -P <pid> <this file> must return 0 (the driver
# start_ap ran synchronously in setup before daemonize).  Key installation is
# NOT part of this ladder: an OPEN network must start without add_key.
interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=wr3000v2-cleanroom-open
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4

# open network (no wpa= line)
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
