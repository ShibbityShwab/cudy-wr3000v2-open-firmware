# hostapd-open.conf - wifi-hostapd-deploy lane (shared task task-125).
#
# 2.4 GHz channel 6, OPEN network, on the clean-room wlan0 AP VAP.
# This is the POSITIVE AP-start fixture: hostapd's NL80211_CMD_NEW_BEACON
# reaches the cfg80211 driver start_ap op and the provider's 2-frame
# g0-id1 AP sequence (ap_ssid key 0x0005 -> ap_cfg key 0x0127). No key
# installation is needed, so it does not depend on the still-M3 add_key op.
#
# Bench path on the box (deployed by ../deploy-hostapd.sh):
#   /root/hostapd-deploy/hostapd-open.conf
# Canonical command (see ../AP-START-LADDER.md):
#   hostapd -B -i wlan0 -P /root/hostapd-deploy/hostapd.pid /root/hostapd-deploy/hostapd-open.conf
#
# This is a lab fixture, not a product config. No credential is present.

driver=nl80211
interface=wlan0

ssid=wr3000v2-apstart
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4

# open network: no wpa=/wpa_key_mgmt/rsn_pairwise lines
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
