# SPDX-License-Identifier: GPL-2.0
# hostapd-wpa2.conf - wifi-hostapd-deploy lane (shared task task-125).
#
# 2.4 GHz channel 6, WPA2-PSK/CCMP NEGATIVE fixture on wlan0.
# The driver's add_key op is still M3 (NULL in cfg80211_ops), so this config
# is expected to stop with -EOPNOTSUPP at key installation AFTER the start_ap
# frame sequence has already been posted; it is run only to record that exact
# userspace failure. Use hostapd-open.conf for the positive AP-start gate.
#
# The passphrase is a throw-away lab placeholder - never a real credential.
# Replace it locally for a bench run; do not commit a real PSK.

driver=nl80211
interface=wlan0

ssid=wr3000v2-apstart-wpa2
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=CHANGEME-lab-only
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
