#
# /etc/modprobe.d/hi5622-wifi.conf - packaged defaults for the clean-room
# Hi5622V100 Wi-Fi driver on the Cudy WR3000 v2.0 FINAL IMAGE #2.
#
# IMPORTANT (bench-confirmed 2026-11-27): modprobe on this image does NOT pass
# command-line module parameters, and the proven load path is an explicit
# "insmod .../hi5622_wifi.ko <options>".  The shipped loader
# (/usr/sbin/hi5622-load) therefore uses insmod with these same values spelled
# out.  This file only makes a manual "modprobe hi5622_wifi" carry the packaged
# defaults (and mirrors /etc/config/hi5622 settings - keep both in sync;
# tools/selftest.sh checks it).
#
# MODULE: CORRECTED FINAL ASSOCIATION + RX-WATERMARK build, 347,388 B
# sha256 d2c608e7c8f578c2443b2dabc381cc660cdb12055ff682a662ab1a31eb609ab6,
# 57 parameters, vermagic "6.18.60 SMP mod_unload ARMv7 p2v8",
# depends=cfg80211.  Chain: final all-patch tree + wpa3-sae + ap-mgmt + sta-ops
# + data-tx + the CORRECTED mgmt-TX carrier (HCC g0 id6 control message) + the
# EAPOL/data RX refill watermark (rx_refill_wm, task-156).
# The values are the single-boot hardware validation recipe
# (wifi-stability/FINAL-INTEGRATION.md section 4): allow_frames=32 /
# h2d_send_budget=10 are REQUIRED for the WPA2/RX rungs, and
# rx_enable/beacon_static/wpa_keys select the validated feature set.
# The association gates stay 0 (fail-closed) unless a fire sets them.
#
# Load cfg80211 first:  modprobe cfg80211 && modprobe hi5622_wifi
options hi5622_wifi fw_path=hi_wifi/FIRMWARE.PD4.bin wifi_block_path=hi_wifi/wifi_block.bin allow_frames=32 frame_gap_ms=100 h2d_send_budget=10 vap_start_first=1 vap_start_mode=1 vap_start_module=0 scan_dwell_ms=60 hcc_poll_ms=5 hcc_trace=0 stop_ap_mode=0 mgmt_diag=0 rx_enable=1 beacon_static=1 beacon_vap_start=1 wpa_keys=1 wpa_key_module=0 sta_join=0 ht_mode=0 vht_cap=0 band_vendor=0 scan_band_cfg=0 rx_refill_wm=75 mgmt_tx=0 mgmt_rx=0 sta_ops=0 eapol_rx=0 sta_user_del=0 data_tx=0 data_tx_peer=1 data_tx_protect=0 data_tx_timeout_ms=200 txq_publish=1 cfg80211_auto=1 ap_start_mode=0 rd_ab_write=0 hcc_cece_mode=0 allow_unseeded_release=0
