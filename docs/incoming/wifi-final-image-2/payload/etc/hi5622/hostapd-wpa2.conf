#
# hostapd-wpa2.conf - WPA2-PSK/CCMP AP fixture for the CORRECTED FINAL
# ASSOCIATION driver (image #2).
#
# STATUS (2026-11-27, hardware-validated in one boot): the M3 key path EXISTS
# in the final all-patch module - struct cfg80211_ops carries
# .add_key/.del_key/.set_default_key (module parameter wpa_keys=1), which post
# the decoded WAL g0 id1 commands 0x0078 (key_add, 96 B), 0x0079
# (set_default_key, 68 B) and 0x007A (key_del).  hostapd start_ap reaches
# AP-ENABLED and the AP GTK is installed by the firmware workers at
# CA 0x0A5825 / 0x0A5C9D (proven: "key_add ... 96 B idx=1 multi
# cipher=0x000fac04" + "set_default_key ... 68 B idx=1 multi=1", consumed 0
# polls).
#
# ASSOCIATION CHAIN (in image #2's driver, fail-closed until fired): the
# corrected .mgmt_tx carrier (HCC g0 id6 control message, 86 B hardware-
# accepted), .mgmt RX (D2H CRX event g1 id13 -> cfg80211_rx_mgmt_ext),
# .add/change/del_station + per-STA firmware context, EAPOL/data RX delivery
# and ndo_start_xmit -> dp TX (EAPOL msg1/msg3) are all implemented in the
# image module behind mgmt_tx/mgmt_rx/sta_ops/eapol_rx/data_tx.  The first
# combined client-association fire is pending (RF/antenna + client-side
# reliability); this fixture is the WPA2 4-way target.
#
# SSID/PSK below are the project's TEST network identity used by the external
# observer harness (cudy-ap-test / test-passphrase-121).  It is a throwaway
# lab credential, not a real secret; never reuse it anywhere.
#
# Placeholder-only policy: a real deployment must replace wpa_passphrase.

driver=nl80211
interface=wlan0

ssid=cudy-ap-test
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=16

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

# HT20 (driver wiphy: HT20-only skeleton; no HT40)
ieee80211n=1
ht_capab=[HT20][SHORT-GI-20]

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=test-passphrase-121
wpa_group_rekey=600

# PMF (ieee80211w=1) needs management-frame RX and is deliberately NOT
# enabled: enable it only together with the M4 mgmt path.
#ieee80211w=1
