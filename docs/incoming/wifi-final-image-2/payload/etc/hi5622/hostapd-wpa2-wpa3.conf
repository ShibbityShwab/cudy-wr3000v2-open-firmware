# SPDX-License-Identifier: GPL-2.0
#
# hostapd-wpa2-wpa3.conf - wifi-wpa3-sae lane (shared task task-144).
#
# WPA2/WPA3 TRANSITION mode: RSN IE advertises WPA-PSK (AKM 2) + SAE (AKM 8),
# PMF optional (ieee80211w=1) with SAE stations required to negotiate PMF
# (sae_require_mfp=1), CCMP only, BIP-CMAC-256 group management cipher.
#
# FUNCTIONAL STATE: parser+semantic-validated host-side and carried in image
# #2; the driver now has the management TX carrier (HCC g0 id6), management RX
# (D2H g1 id13), station ops and EAPOL/data TX behind fail-closed gates, and
# the AP-start key path (GTK/IGTK) is proven on the WPA3 build.  A client
# joining over the transition profile is the pending bench step; this is the
# WPA2/WPA3 transition target, not a claimed working secured AP.
#
# sae_pwe=2 for the same RSNXE/beacon-slot reason as hostapd-wpa3-sae.conf.
#
# Placeholder credential only - never a real PSK.

driver=nl80211
interface=wlan0

ssid=cudy-wr3000v2-wpa23
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=16

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

ieee80211n=1
ht_capab=[HT20][SHORT-GI-20]

wpa=2
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
group_mgmt_cipher=BIP-CMAC-256
ieee80211w=1
sae_require_mfp=1
sae_pwe=2
wpa_passphrase=CHANGEME-lab-only
wpa_group_rekey=600
