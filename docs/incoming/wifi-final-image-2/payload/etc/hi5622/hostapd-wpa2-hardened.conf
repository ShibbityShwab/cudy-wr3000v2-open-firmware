# SPDX-License-Identifier: GPL-2.0
#
# hostapd-wpa2-hardened.conf - wifi-wpa3-sae lane (shared task task-144).
#
# Hardened WPA2-Personal (PSK/CCMP) with PMF REQUIRED (ieee80211w=2), no TKIP,
# no WEP, BIP-CMAC-256 group management cipher, group rekey 600 s.  This is the
# "WPA2 done as strictly as WPA2 allows" fixture (802.11w mandatory), i.e. the
# strongest WPA2 profile a WPA3 transition network can fall back to.
#
# FUNCTIONAL STATE: parser+semantic-validated host-side and carried in image
# #2; AP GTK + PMF IGTK + default management key install is proven on the
# WPA3 module build, which image #2's driver includes, and the association
# chain (mgmt TX/RX, station ops, EAPOL/data TX) is implemented behind
# fail-closed gates.  The first combined association fire is pending.
#
# Placeholder credential only - never a real PSK.

driver=nl80211
interface=wlan0

ssid=cudy-wr3000v2-wpa2h
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=16

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

ieee80211n=1
ht_capab=[HT20][SHORT-GI-20]

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
group_mgmt_cipher=BIP-CMAC-256
ieee80211w=2
wpa_passphrase=CHANGEME-lab-only
wpa_group_rekey=600
