# SPDX-License-Identifier: GPL-2.0
#
# hostapd-wpa3-sae.conf - wifi-wpa3-sae lane (shared task task-144).
#
# WPA3-Personal (SAE) ONLY, PMF REQUIRED, CCMP group/pairwise.  This is the
# hardened WPA3 target fixture for the Hi5622 clean-room AP: RSN IE with AKM 8
# (SAE), no PSK AKM, no TKIP/WEP, MFP mandatory (ieee80211w=2), BIP-CMAC-256
# group management cipher.
#
# FUNCTIONAL STATE: this profile reached AP-ON-AIR as its own build (RSN IE
# SAE + MFP-required + BIP-CMAC-256 seen by the external observer) and the
# GTK + IGTK + set_default_mgmt_key install is proven.  Image #2's driver adds
# the management TX carrier (HCC g0 id6), management RX (D2H g1 id13), station
# ops and EAPOL/data TX behind fail-closed gates; a real SAE client
# association/full 4-way is the pending bench step, not a config change.
#
# sae_pwe=2 (both hunting-and-pecking and H2E) is deliberate: the AP-start
# message family carries one 64-byte RSN IE slot and one vendor/WMM IE slot,
# so hostapd's RSNXE (element 244) is not delivered to the firmware today;
# strict H2E-only (sae_pwe=1) would need RSNXE in the beacons first.
#
# The passphrase below is a throw-away lab placeholder.  Replace it locally
# for a bench run; never commit a real credential.

driver=nl80211
interface=wlan0

ssid=cudy-wr3000v2-wpa3
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=16

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

ieee80211n=1
ht_capab=[HT20][SHORT-GI-20]

wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
group_mgmt_cipher=BIP-CMAC-256
ieee80211w=2
sae_require_mfp=1
sae_pwe=2
wpa_passphrase=CHANGEME-lab-only
wpa_group_rekey=600
