# hostapd-2g-bss-color.conf - 2.4 GHz OPEN HE (802.11ax) AP fixture for the
# wifi-bss-color lane FIRE-RECIPE (task-233).  Minimal HE: HT20 channel 6, no
# WPA (so the HE/BSS-colour rung does not depend on the key path), and a
# DETERMINISTIC HE BSS colour: he_bss_color=25 (the colour the firmware-built
# HE Operation IE already shows on image #3).  hostapd turns this into
# NL80211_ATTR_HE_BSS_COLOR {COLOR 25} on start_ap -> the driver's bss_color=1
# post of the g0 id36 bitmap.
driver=nl80211
interface=wlan0
ssid=cudy-ap-test-bsscolor
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4
ieee80211n=1
ieee80211ax=1
he_bss_color=25
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
