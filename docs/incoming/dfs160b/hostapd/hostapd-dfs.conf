# hostapd fixture - lane dfs160b (task-245): the DFS/CAC rung.
# HOST-ONLY file; the Lead fires.  ch52 requires a CAC: hostapd sends
# NL80211_CMD_RADAR_DETECT before start_ap; the driver (dfs_cac=1) posts the
# H2D key 0x07E7 ARM, runs the 60000 ms CAC timer, posts the CLEAR and reports
# NL80211_RADAR_CAC_FINISHED; start_ap is then gated on that CAC (the
# start_ap DFS gate).  No dfs_offload: the CAC runs in this clean-room driver.
driver=nl80211
ssid=hi5622-dfs160b-dfs
hw_mode=a
channel=52
ieee80211d=1
ieee80211h=1
country_code=US
ieee80211n=1
ieee80211ac=1
vht_oper_chwidth=0
auth_algs=1
wpa=0
# never: dfs_offload=1 (the firmware CAC is driven by the host runtime)
