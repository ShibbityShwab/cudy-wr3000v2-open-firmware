# hostapd fixture - lane dfs160b (task-245): the 160 MHz rung.
# HOST-ONLY file; the Lead fires.  ch36 is a NON-DFS 160 MHz segment centre 50.
# The driver advertises VHT 0x00400064 (160 MHz bit) on the 5 GHz band, so no
# vht_capab override is needed.  ht_bw=1 on the module load derives the H2D
# key 0x0124 body[1] selector 3 from vht_oper_chwidth=2 / seg0=50.
driver=nl80211
ssid=hi5622-dfs160b-160
hw_mode=a
channel=36
ieee80211d=1
ieee80211h=1
country_code=US
ieee80211n=1
ieee80211ac=1
vht_oper_chwidth=2
vht_oper_centr_freq_seg0_idx=50
auth_algs=1
wpa=0
