# hostapd -- 2.4 GHz ch 6, WPA2-PSK/CCMP (start_ap sequence + RSN IE)
interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ssid=cudy-ap-test
wpa_passphrase=test-passphrase-121
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wmm_enabled=1
ieee80211n=1
ht_capab=[HT20]
