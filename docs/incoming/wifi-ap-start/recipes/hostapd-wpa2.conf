# hostapd-mini -- 2.4 GHz ch 6, WPA2-PSK/CCMP (LATER rung, not first fire)
# Needs the M3 key path (cfg80211 .add_key/.set_key); hostapd starts beaconing
# but stops at key installation until that lands.
interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ssid=cudy-ap-test
wpa_passphrase=test-passphrase-121
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
