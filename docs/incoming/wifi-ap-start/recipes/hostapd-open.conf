# hostapd-mini -- 2.4 GHz ch 6, OPEN, no HT/WMM (first AP fire)
# OpenWrt 2.12 hostapd-mini; /usr/share/hostap/*.uc from wifi-scripts must be
# present (see ../HOSTAPD-BRINGUP.md and ../image/wifi-scripts-ucode.md).
interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ssid=cudy-ap-test
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
auth_algs=1
# No ieee80211n / no wmm: the first rung needs neither HT caps in the wiphy
# nor a set_txq_params op.  Keep it minimal until the sequence is proven.
