# SPDX-License-Identifier: GPL-2.0
# hostapd.conf - wifi-scan-ap lane (shared task task-113), 2.4 GHz ch 6,
# WPA2-PSK/CCMP on the clean-room wlan0 VAP.
#
# HOST-ONLY SAMPLE: this file is a userspace fixture for the bench ladder in
# ../TEST-LADDER.md.  It contains NO real credential - the passphrase below is
# a placeholder; substitute a throw-away lab PSK at the bench and never commit
# it.  The driver's add_key path is still M3 (NULL op => -EOPNOTSUPP), so the
# WPA2 run is expected to fail at key installation and is a NEGATIVE test
# until the key/WAL messages exist.  Use hostapd-open.conf for the positive
# control-plane test.
#
# The openwrt/box path: /etc/hostapd.conf; run with
#   hostapd -dd -t /etc/hostapd.conf
# Stop rules and expected observables: ../TEST-LADDER.md sec 3.

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# 2.4 GHz, channel 6 (vendor-advertised 1..13; 6 is the least DFS/regulatory
# entangled choice for a lab run)
ssid=wr3000v2-cleanroom-lab
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4

# WPA2-PSK / CCMP only (the wiphy advertises WEP40/WEP104/TKIP/CCMP/GCMP/
# AES_CMAC; the vendor userspace default is WPA2-CCMP)
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=CHANGEME-lab-only
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
