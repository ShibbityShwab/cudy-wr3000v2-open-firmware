# SPDX-License-Identifier: GPL-2.0
# hostapd-open.conf - wifi-scan-ap lane (shared task task-113), 2.4 GHz ch 6,
# OPEN network on the clean-room wlan0 VAP.
#
# This is the POSITIVE control-plane test while the driver's key path is still
# M3: cfg80211 start_ap reaches the driver (start_ap -> provider WAL frame ->
# hi5622_frame_post gate) without needing add_key.  It does not prove data
# forwarding or beaconing; see ../TEST-LADDER.md sec 4 for observables and
# stop rules.  The WPA2 config (hostapd.conf) is the target and is expected to
# stop at key installation until M3 lands.
#
# openwrt/box path: /etc/hostapd-open.conf
#   hostapd -dd -t /etc/hostapd-open.conf

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=wr3000v2-cleanroom-open
hw_mode=g
channel=6
beacon_int=100
dtim_period=2
max_num_sta=4

# open network (no wpa= line)
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
