# SPDX-License-Identifier: GPL-2.0
# wpa_supplicant.conf - wifi-scan-ap lane (shared task task-113), STA side of
# the 2.4 GHz ch 6 WPA2-CCMP test.
#
# HOST-ONLY SAMPLE: no real credential - the psk below is a placeholder; a
# throw-away lab PSK must never be committed.  The driver's connect family is
# still M5 (NULL ops => -EOPNOTSUPP) and its add_key path is M3, so this
# association test is a NEGATIVE test today: wpa_supplicant is expected to
# fail at NL80211_CMD_CONNECT with -EOPNOTSUPP.  It is in the ladder so the
# exact failure is observed and recorded, not guessed.
#
# openwrt/box path: /etc/wpa_supplicant.conf; run with
#   wpa_supplicant -dd -i wlan0 -c /etc/wpa_supplicant.conf -D nl80211
# Expected observables / stop rules: ../TEST-LADDER.md sec 5.

ctrl_interface=/var/run/wpa_supplicant
update_config=0
ap_scan=1

network={
	ssid="wr3000v2-cleanroom-lab"
	psk="CHANGEME-lab-only"
	proto=RSN
	key_mgmt=WPA-PSK
	pairwise=CCMP
	group=CCMP
	scan_ssid=0
}
