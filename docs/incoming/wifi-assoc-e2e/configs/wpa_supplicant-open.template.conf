# wpa_supplicant-open.template.conf - wifi-assoc-e2e lane (host client, OPEN control rung)
#
# TEMPLATE ONLY. assoc_e2e.py substitutes @SSID@ / @CTRL@ and writes the real
# file to the run's evidence directory (mode 0600, outside the tracked tree).
# The bench AP profile is the published lab fixture (no secret): see
# ../../wifi-image-polish/rootfs/etc/hi5622/hostapd-open.proven.conf.
ctrl_interface=@CTRL@
update_config=0
ap_scan=1
p2p_disabled=1

network={
	ssid="@SSID@"
	key_mgmt=NONE
	scan_ssid=1
	freq_list=@FREQ@
}
