# wpa_supplicant-wpa2.template.conf - wifi-assoc-e2e lane (host client, WPA2-PSK/CCMP rung)
#
# TEMPLATE ONLY. The PSK token is replaced at staging time from ASSOC_PSK
# (default is the published lab value; never commit a real credential). The bench AP
# profile is wifi-ap-start/recipes/hostapd-wpa2.conf (ssid cudy-ap-test,
# WPA2-PSK/CCMP, ieee80211w=0 - the hardware-fired WPA2 AP config).
ctrl_interface=@CTRL@
update_config=0
ap_scan=1
p2p_disabled=1

network={
	ssid="@SSID@"
	psk="@PSK@"
	key_mgmt=WPA-PSK
	proto=RSN
	pairwise=CCMP
	group=CCMP
	ieee80211w=0
	scan_ssid=1
	freq_list=@FREQ@
}
