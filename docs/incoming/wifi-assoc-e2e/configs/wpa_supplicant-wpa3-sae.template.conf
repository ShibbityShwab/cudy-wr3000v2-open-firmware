# wpa_supplicant-wpa3-sae.template.conf - wifi-assoc-e2e lane (host client, WPA3-SAE rung)
#
# TEMPLATE ONLY. The AP fixture is hostapd-wpa3-sae.conf (SAE only, MFP
# required, BIP-CMAC-256); sae_pwe=2 matches the AP side (RSNXE is not carried
# in the AP-start message family today, so H2E-only would fail).
ctrl_interface=@CTRL@
update_config=0
ap_scan=1
p2p_disabled=1

network={
	ssid="@SSID@"
	psk="@PSK@"
	key_mgmt=SAE
	proto=RSN
	pairwise=CCMP
	group=CCMP
	ieee80211w=2
	sae_pwe=2
	scan_ssid=1
	freq_list=@FREQ@
}
