# wpa_supplicant-wpa2.conf - wifi-onair-observer lane (host-side external observer)
#
# Purpose: associate the observer host's SECOND managed interface (default
# wlan1) to the bench AP (SSID cudy-ap-test, 2.4 GHz channel 6, WPA2-PSK/CCMP)
# and let the harness capture the full 4-way handshake result.
#
# This is a disposable LAB fixture. The passphrase below is the published
# bench test value used by the AP-side fixture
# (../../wifi-ap-start/recipes/hostapd-wpa2.conf); it is NOT a real credential
# and must never be reused for any user, stock-firmware or production network.
# Override with ONAIR_PSK=<lab value> if the bench AP appears with another
# lab passphrase; the harness writes a temporary copy outside the repo and
# redacts the value from its logs.
#
# Run (the harness does this):
#   wpa_supplicant -B -D nl80211 -i wlan1 -c <this file> \
#       -P <pid> -f <log> -d
#   wpa_cli -p /run/wpa_supplicant-onair -i wlan1 status

ctrl_interface=/run/wpa_supplicant-onair
update_config=0
ap_scan=1

network={
	ssid="cudy-ap-test"
	psk="test-passphrase-121"
	key_mgmt=WPA-PSK
	proto=RSN
	pairwise=CCMP
	group=CCMP
	# PMF is off for the WPA2 fixture (the AP side keeps ieee80211w=0);
	# see wpa_supplicant-wpa3-sae.conf for the PMF/SAE variant.
	ieee80211w=0
}
