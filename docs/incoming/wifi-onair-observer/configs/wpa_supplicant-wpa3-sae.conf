# wpa_supplicant-wpa3-sae.conf - wifi-onair-observer lane (WPA3-SAE variant)
#
# Purpose: attempt WPA3-SAE association to the bench AP when the AP side has
# been restarted with the WPA2+WPA3 transition fixture
# (../../wifi-image-polish/rootfs/etc/hi5622/hostapd-wpa2-wpa3.conf: wpa=2,
# wpa_key_mgmt=WPA-PSK SAE, ieee80211w=1, ieee80211n=1).
#
# EXPECTED RESULT TODAY: FAIL at the SAE authentication stage. The clean-room
# AP driver has a fail-closed .mgmt_tx and no management RX; SAE needs the
# AUTH frame TX/RX path (static RE: the vendor does AP mgmt in host software
# via hmac_ap_up_rx_mgmt -> wal_cfg80211_mgmt_tx). The harness records the
# exact failure and must never report WPA3 as working.
#
# Disposable LAB fixture - same caveat as wpa_supplicant-wpa2.conf.

ctrl_interface=/run/wpa_supplicant-onair
update_config=0
ap_scan=1

network={
	ssid="cudy-ap-test"
	psk="test-passphrase-121"
	key_mgmt=SAE
	proto=RSN
	pairwise=CCMP
	group=CCMP
	ieee80211w=2
	sae_pwe=2
}
