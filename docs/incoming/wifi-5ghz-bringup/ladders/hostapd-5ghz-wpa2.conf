# SPDX-License-Identifier: GPL-2.0
# hostapd-5ghz-wpa2.conf - wifi-5ghz-bringup (task-154), 5 GHz ch36, WPA2-PSK/CCMP.
#
# HOST-ONLY SAMPLE for FIRE-RECIPE G7. The passphrase is a PLACEHOLDER:
# substitute the throw-away lab PSK at the bench and never commit it.
# The key path (g0 id1 cmd 0x0078/0x0079) is hardware-proven on 2.4 GHz; this
# rung cross-checks it with band=1. Run it on a FRESH boot/load (one AP start
# per module load; a hostapd restart on the same load is unsafe - stale-VAP
# latch), i.e. pick this config at G5 instead of restarting.

interface=wlan5
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

country_code=US

ssid=cudy-ap-test-5g
hw_mode=a
channel=36
beacon_int=100
dtim_period=2
max_num_sta=4

auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=CHANGEME-lab-only
