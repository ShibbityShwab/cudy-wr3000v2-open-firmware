# hostapd-5ghz-open.conf - wifi-5ghz-bringup (task-154), 5 GHz ch36, OPEN.
#
# HOST-ONLY SAMPLE for FIRE-RECIPE G5. With the one-radio/two-band module the
# 5 GHz band lives on the PRIMARY endpoint's wiphy (iw: phy0, Band 2), so this
# AP runs on that phy (the only registered phy); create the interface with:
#
#   iw phy phy0 interface add wlan5 type __ap
#   ip link set wlan5 up
#   iw reg set US                      # world regdomain marks 5 GHz NO_IR
#   /usr/sbin/hostapd -dd -t /tmp/hostapd-5ghz-open.conf
#
# No secret in this file.

interface=wlan5
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

country_code=US

# 5 GHz, 20 MHz, non-DFS ch36 (no CAC needed)
ssid=cudy-ap-test-5g
hw_mode=a
channel=36
beacon_int=100
dtim_period=2
max_num_sta=4

# First rung is legacy OFDM; the wiphy advertises the band5g=1 HT/VHT profile,
# a later rung can add ieee80211n=1 ht_capab=[SHORT-GI-20], ieee80211ac=1.
auth_algs=1
wmm_enabled=1
ignore_broadcast_ssid=0
