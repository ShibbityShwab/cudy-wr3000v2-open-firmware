# Extracts the SOFT-FLOAT (kirkwood/arm_xscale) OpenWrt binaries so they can be checked LOCALLY.
#
# WHY THIS EXISTS: init executes on our kernel and is killed by SIGILL. To find out WHICH
# instruction, the kernel is being made to print the faulting pc (CONFIG_DEBUG_USER +
# user_debug=1), and then that address has to be disassembled - which needs the actual file.
#
# THE VENDOR KERNEL CANNOT PROVIDE IT: mounting the same squashfs on the vendor system reads
# /etc/openwrt_release fine but gives "I/O error" on bin/busybox and cp produces 0-byte files -
# metadata and small fragment-stored files work, real xz data blocks do not. OUR kernel reads
# it well enough to execute init, so the image is sound and the vendor's squashfs/xz path is
# the limitation.
#
# Triggered ONLY by a change to this file, on any branch, so pushing it does NOT start a
# kernel build (that workflow watches omo/** only).
name: extract-owrt-a9

on:
  push:
    paths:
      - '.github/workflows/extract-owrt-a9.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - name: the mvebu/cortexa9 image (arm_cortex-a9_vfpv3-d16)
        run: |
          set -eux
          curl -sSLo img.bin https://downloads.openwrt.org/releases/25.12.5/targets/kirkwood/generic/openwrt-25.12.5-kirkwood-generic-iom_iconnect-1.1-squashfs-sysupgrade.bin
          ls -l img.bin

      - name: carve the squashfs out of it (marker 0, uImage 2048, squashfs at 3883008)
        run: |
          set -eux
          python3 - <<'PY'
          import struct
          b = open("img.bin","rb").read()
          i = b.find(b"hsqs")
          blk, frags, comp = struct.unpack("<I", b[i+12:i+16])[0], struct.unpack("<I", b[i+16:i+20])[0], struct.unpack("<H", b[i+20:i+22])[0]
          bytes_used = struct.unpack("<Q", b[i+40:i+48])[0]
          print("squashfs at", i, "block", blk, "comp", comp, "bytes_used", bytes_used)
          open("root.sqfs","wb").write(b[i:i+bytes_used])
          PY
          ls -l root.sqfs

      - name: unsquash and keep the binaries that matter
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools binutils-arm-linux-gnueabihf
          # dev/console is a character device and we are not root, so unsquashfs exits 2
          # AFTER extracting everything else - 939 of 940 entries. That is fine and the
          # binaries are all there; tolerating the non-zero exit is the point.
          unsquashfs -q -no-progress -d root root.sqfs || true
          test -f root/bin/busybox
          cat root/etc/openwrt_release
          mkdir -p out
          cp root/sbin/init out/init
          cp root/lib/libc.so out/libc.so
          cp root/bin/busybox out/busybox
          for f in root/sbin/procd root/lib/ld-musl-armhf.so.1; do
            [ -e "$f" ] && cp "$f" out/ || true
          done
          ls -l out

      - name: what the compiler actually required
        run: |
          set -eux
          for f in out/init out/libc.so out/busybox; do
            echo "=== $f ==="
            file "$f"
            readelf -h "$f" | egrep 'Machine|Flags|Entry'
            readelf -A "$f" 2>/dev/null | egrep -i 'cpu_arch|VFP|DIV_use|SIMD|FP_arch' || true
            echo "--- hardware divide / vfpv4 in the code ---"
            arm-linux-gnueabihf-objdump -d "$f" > dis.txt 2>/dev/null || true
            echo "disassembly lines:" $(wc -l < dis.txt)
            echo "--- FP + divide (need VFP/IDIV, absent on this part) ---"
            egrep -c '\b(udiv|sdiv|vfma|vfms|vadd|vmov|vldr|vstr|vpush|vpop)\b' dis.txt || true
            echo "--- swp/swpb (this silicon reports NO HWCAP_SWP) ---"
            egrep -c '\b(swp|swpb)\b' dis.txt || true
            egrep -m2 -B4 -A2 '\b(swp|swpb)\b' dis.txt || echo "  (no swp)"
            echo "--- ldrex/strex (safe: ARMv6+ atomics) ---"
            egrep -c '\b(ldrex|strex|ldrexb|strexb|ldrexd|strexd)\b' dis.txt || true
            echo "--- first FP sighting, if any ---"
            egrep -m1 -B3 -A1 '\b(vmov|vldr|vstr|vadd|vpush|vpop)\b' dis.txt || echo "  (no FP at all)"
            rm -f dis.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: owrt-a9-binaries
          path: out/
          if-no-files-found: error

  ubifs:
    name: build the rootfs_data UBIFS image
    runs-on: ubuntu-22.04
    steps:
      - name: mtd-utils
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y mtd-utils
          mkfs.ubifs -V

      - name: a minimal overlay, in the volume's own geometry
        run: |
          set -eux
          # THE GEOMETRY IS THE VOLUME'S, MEASURED ON THE DEVICE:
          #   mtd16 PEB 131072 = 128 KiB, so UBI LEB = 131072 - 2*2048 = 126976
          #   the rootfs_data volume is 79 LEBs
          # -x none IS DELIBERATE: it needs no compressor from the kernel, so the image cannot
          # fail to mount over a UBIFS compressor the build happens not to enable.
          mkdir -p tree/etc/config
          mkfs.ubifs -x none -m 2048 -e 126976 -c 79 -r tree -o owrt-rootfs_data.ubifs
          ls -l owrt-rootfs_data.ubifs
          # what the image claims, read back with the tool that made it
          ubinize -o /dev/null -m 2048 -p 128KiB -s 2048 /dev/null 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: owrt-rootfs-data-ubifs
          path: owrt-rootfs_data.ubifs
          if-no-files-found: error
