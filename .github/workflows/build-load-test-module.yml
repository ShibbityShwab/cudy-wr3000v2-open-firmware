name: build-load-test-module

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: vanilla kernel source
        run: |
          curl -sSLo linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.201.tar.xz
          tar xf linux.tar.xz
          sed -i 's|#define MODULE_ARCH_VERMAGIC_P2V "p2v8 "|#define MODULE_ARCH_VERMAGIC_P2V ""|' linux-5.10.201/arch/arm/include/asm/vermagic.h
          grep -n 'P2V' linux-5.10.201/arch/arm/include/asm/vermagic.h

      - name: prepare kernel for external modules
        run: |
          cd linux-5.10.201
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- multi_v7_defconfig
          scripts/config --enable SMP --disable PREEMPT --enable MODULE_UNLOAD --disable MODVERSIONS --disable ARM_PATCH_PHYS_VIRT --set-str LOCALVERSION ""
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare -j"$(nproc)"

      - name: build test module
        run: |
          cd lab/hello
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build hwprobe module
        run: |
          cd lab/hwprobe
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build barsnap module
        run: |
          cd lab/barsnap
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build barmap module
        run: |
          cd lab/barmap
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build calread module
        run: |
          cd lab/calread
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build ringwatch module
        run: |
          cd lab/ringwatch
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build calwrite module
        run: |
          cd lab/calwrite
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build takeover module
        run: |
          cd lab/takeover
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build bringup module
        run: |
          cd lab/bringup
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build epinit module
        run: |
          cd lab/epinit
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build eteprobe module
        run: |
          cd lab/eteprobe
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build eteinit module
        run: |
          cd lab/eteinit
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      - name: build fwload module
        run: |
          cd lab/fwload
          make -C ../../linux-5.10.201 M="$PWD" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules

      # ---- ABI-match lane: build the probe and the wifiskel skeleton with the
      # default CONFIG_PM=y headers first, then with CONFIG_PM forced off, so the
      # struct-offset delta is captured in both binaries. ----

      - name: build wifiskel + abiprobe (PM on)
        run: |
          make -C linux-5.10.201 M="$PWD/lab/wifiskel" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules
          make -C linux-5.10.201 M="$PWD/lab/abiprobe" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules
          mkdir -p "$RUNNER_TEMP/abi-artifacts"
          cp lab/wifiskel/wifiskel.ko "$RUNNER_TEMP/abi-artifacts/wifiskel-pm-on.ko"
          cp lab/abiprobe/abiprobe.ko "$RUNNER_TEMP/abi-artifacts/abiprobe-pm-on.ko"

      - name: force CONFIG_PM off in prepared headers (match vendor)
        run: sh lab/abi-pm-off.sh "$PWD/linux-5.10.201"

      - name: build wifiskel + abiprobe (PM off)
        run: |
          rm -f lab/wifiskel/wifiskel.o lab/wifiskel/wifiskel.ko
          rm -f lab/abiprobe/abiprobe.o lab/abiprobe/abiprobe.ko
          make -C linux-5.10.201 M="$PWD/lab/wifiskel" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules
          make -C linux-5.10.201 M="$PWD/lab/abiprobe" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules
          cp lab/wifiskel/wifiskel.ko "$RUNNER_TEMP/abi-artifacts/wifiskel-pm-off.ko"
          cp lab/abiprobe/abiprobe.ko "$RUNNER_TEMP/abi-artifacts/abiprobe-pm-off.ko"
          echo "== autoconf.h PM state seen by the PM-off build =="
          grep -nE 'CONFIG_PM( |_SLEEP )' linux-5.10.201/include/generated/autoconf.h || true
          md5sum "$RUNNER_TEMP"/abi-artifacts/*.ko

      - name: build wifidrv0 (PM off)
        run: |
          rm -f lab/wifidrv0/wifidrv0.o lab/wifidrv0/wifidrv0.ko
          make -C linux-5.10.201 M="$PWD/lab/wifidrv0" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules
          cp lab/wifidrv0/wifidrv0.ko "$RUNNER_TEMP/abi-artifacts/wifidrv0-pm-off.ko"
          echo "== wifidrv0 under the PM-off headers =="
          grep -nE 'CONFIG_PM( |_SLEEP )' linux-5.10.201/include/generated/autoconf.h || true
          md5sum lab/wifidrv0/wifidrv0.ko

      - name: show vermagic
        run: |
          strings lab/hello/hello.ko | grep -m1 vermagic
          strings lab/hwprobe/hwprobe.ko | grep -m1 vermagic
          strings lab/barsnap/barsnap.ko | grep -m1 vermagic
          strings lab/barmap/barmap.ko | grep -m1 vermagic
          strings lab/calread/calread.ko | grep -m1 vermagic
          strings lab/ringwatch/ringwatch.ko | grep -m1 vermagic
          strings lab/calwrite/calwrite.ko | grep -m1 vermagic
          strings lab/takeover/takeover.ko | grep -m1 vermagic
          strings lab/bringup/bringup.ko | grep -m1 vermagic
          strings lab/epinit/epinit.ko | grep -m1 vermagic
          strings lab/eteprobe/eteprobe.ko | grep -m1 vermagic
          strings lab/eteinit/eteinit.ko | grep -m1 vermagic
          strings lab/fwload/fwload.ko | grep -m1 vermagic
          strings lab/wifiskel/wifiskel.ko | grep -m1 vermagic
          strings lab/abiprobe/abiprobe.ko | grep -m1 vermagic
          strings lab/wifidrv0/wifidrv0.ko | grep -m1 vermagic

      - uses: actions/upload-artifact@v4
        with:
          name: hello-ko
          path: lab/hello/hello.ko

      - uses: actions/upload-artifact@v4
        with:
          name: hwprobe-ko
          path: lab/hwprobe/hwprobe.ko

      - uses: actions/upload-artifact@v4
        with:
          name: barsnap-ko
          path: lab/barsnap/barsnap.ko

      - uses: actions/upload-artifact@v4
        with:
          name: barmap-ko
          path: lab/barmap/barmap.ko

      - uses: actions/upload-artifact@v4
        with:
          name: calread-ko
          path: lab/calread/calread.ko

      - uses: actions/upload-artifact@v4
        with:
          name: ringwatch-ko
          path: lab/ringwatch/ringwatch.ko

      - uses: actions/upload-artifact@v4
        with:
          name: calwrite-ko
          path: lab/calwrite/calwrite.ko

      - uses: actions/upload-artifact@v4
        with:
          name: takeover-ko
          path: lab/takeover/takeover.ko

      - uses: actions/upload-artifact@v4
        with:
          name: bringup-ko
          path: lab/bringup/bringup.ko

      - uses: actions/upload-artifact@v4
        with:
          name: epinit-ko
          path: lab/epinit/epinit.ko

      - uses: actions/upload-artifact@v4
        with:
          name: eteprobe-ko
          path: lab/eteprobe/eteprobe.ko

      - uses: actions/upload-artifact@v4
        with:
          name: eteinit-ko
          path: lab/eteinit/eteinit.ko

      - uses: actions/upload-artifact@v4
        with:
          name: fwload-ko
          path: lab/fwload/fwload.ko

      - uses: actions/upload-artifact@v4
        with:
          name: wifiskel-ko
          path: lab/wifiskel/wifiskel.ko

      - uses: actions/upload-artifact@v4
        with:
          name: abi-artifacts
          path: ${{ runner.temp }}/abi-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: wifidrv0-ko
          path: lab/wifidrv0/wifidrv0.ko
