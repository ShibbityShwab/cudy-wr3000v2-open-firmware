name: luofu-kernel-config

# The luofu kernel lane (stage-1/2), two jobs:
#
#  * `config` (every omo/** push, ~2 min): applies lab/luofu-kernel/kernel-tree.patch
#    to a pristine 5.10.201 tree (the same patch the image lane uses) and then
#    proves that lab/luofu-kernel/luofu.fragment is a valid fragment for the
#    kernel that actually matters - vanilla 5.10.201, the vendor's own version -
#    by running the kernel's OWN merge_config.sh + olddefconfig against the real
#    Kconfig, then asserting every requested symbol survived. CONFIG_ARCH_LUOFU
#    resolves because of that patch and is asserted; the 12 driver-less
#    CONFIG_*_LUOFU symbols are reported as the to-do list rather than failed on.
#
#  * `kernel` (the IMAGE lane, opt-in, ~25-40 min): builds the first own-kernel
#    image - vanilla 5.10.201 + our machine (arch/arm/mach-luofu) + our
#    devicetree (docs/soc/luofu-r116.dts) + the fragment - into
#      linux-5.10.201/arch/arm/boot/zImage
#      linux-5.10.201/arch/arm/boot/dts/luofu-r116.dtb
#      linux-5.10.201/luofu-uImage        (mkimage, the kernelb tail's kernel half)
#    and uploads them with a size+sha256 MANIFEST.txt. Consumer: the prep in
#    build/tmp/inta-spec/kprep.md sec.3.2 (the kernelb flash) + imgbuild.md.
#
#    Both jobs merge luofu.fragment AND luofu-shrink.fragment: the former is the
#    inventory of what the port needs, the latter is the 8,650,752-byte kernelb
#    size budget (the un-shrunk multi_v7 base was 1,502,327 B over it). The
#    `kernel` job fails if the packed uImage is over budget, and asserts both
#    the symbol groups the shrink must not take with it and the fat it drops.
#
# Triggers: `push` to omo/** (the only branch we push) always fires `config`;
# `kernel` fires on a workflow_dispatch with build_kernel=true (verified to work
# from this branch even though the file is not on the default branch yet), or on
# a push whose head commit message carries the marker [build-kernel] - the marker
# keeps a 30-minute build out of every other push's way. See lab/luofu-kernel/
# README.md "Build / verify".

on:
  push:
    branches: [ 'omo/**' ]
  workflow_dispatch:
    inputs:
      build_kernel:
        description: 'Also build the luofu image (zImage + DTB + uImage)'
        type: boolean
        default: false

jobs:
  config:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: kernel source (vanilla 5.10.201 = the vendor's version)
        run: |
          curl -sSLo linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.201.tar.xz
          tar xf linux.tar.xz

      - name: apply our in-tree additions (the same patch the image lane uses)
        run: |
          # The fragment sets CONFIG_ARCH_LUOFU, so this lane has to see the tree
          # that the image lane builds: the Kconfig/Makefile patch and the files
          # it points at. It also re-checks, on every push, that the patch still
          # applies to the pristine 5.10.201 sources.
          cd linux-5.10.201
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/lab/luofu-kernel/kernel-tree.patch"
          patch -p1           < "$GITHUB_WORKSPACE/lab/luofu-kernel/kernel-tree.patch"
          # the instrumented head files are copied whole (their ten breadcrumb hunks
          # proved patch-version-fragile under cumulative application):
          cp "$GITHUB_WORKSPACE/lab/luofu-kernel/patched-head.S"        arch/arm/kernel/head.S
          cp "$GITHUB_WORKSPACE/lab/luofu-kernel/patched-head-common.S" arch/arm/kernel/head-common.S
          cp -r "$GITHUB_WORKSPACE/lab/luofu-kernel/mach-luofu" arch/arm/mach-luofu
          cp "$GITHUB_WORKSPACE/docs/soc/luofu-r116.dts" arch/arm/boot/dts/luofu-r116.dts
          grep -n 'ARCH_LUOFU' arch/arm/mach-hisi/Kconfig arch/arm/Makefile arch/arm/boot/dts/Makefile

      - name: base config
        run: make -C linux-5.10.201 ARCH=arm multi_v7_defconfig

      - name: merge the fragment + resolve with the kernel's own kconfig
        run: |
          cd linux-5.10.201
          # Use the documented idiom: textual merge (-m) + `make olddefconfig`, which
          # resolves dependencies IN PLACE. (The non -m form runs `make alldefconfig`
          # internally, regenerating from Kconfig defaults - noisy for derived
          # symbols, and it drops arm context unless ARCH is exported.)
          export ARCH=arm
          # Same two fragments, same order, as the image lane below: the
          # inventory first, the kernelb size budget second.
          scripts/kconfig/merge_config.sh -m .config \
            "$GITHUB_WORKSPACE/lab/luofu-kernel/luofu.fragment" \
            "$GITHUB_WORKSPACE/lab/luofu-kernel/luofu-shrink.fragment"
          make ARCH=arm olddefconfig

      - name: assert the requested symbols resolved
        run: |
          cd linux-5.10.201
          frag="$GITHUB_WORKSPACE/lab/luofu-kernel/luofu.fragment"
          fail=0
          for sym in $(grep -E '^CONFIG_[A-Za-z0-9_]+=y$' "$frag" | cut -d= -f1); do
            case "$sym" in
              CONFIG_ARCH_LUOFU) want=required ;;  # Kconfig entry exists: kernel-tree.patch + lab/luofu-kernel/mach-luofu
              *LUOFU*)           want=todo ;;      # driver not in this tree yet -> reported, never failed
              *)                 want=required ;;
            esac
            if grep -qx "$sym=y" .config; then
              echo "  OK    $sym=y"
            elif [ "$want" = "todo" ]; then
              echo "  TODO  $sym (driver not in the tree yet - expected)"
            else
              echo "  FAIL  $sym requested but not in final .config"
              grep -w "$sym" .config || true
              fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: luofu-kernel-config
          path: linux-5.10.201/.config

  kernel:
    # The image lane. The job keeps the name of the boilerplate evaluation job
    # it replaces: same build, now with our machine and our DTB in the tree.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_kernel) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-kernel]')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      # scripts/mkcompile_h falls back to `date`, so the UTS banner (and with it the
      # zImage) changes every build; pinning the three stamps to the commit makes
      # the artifact reproducible for a given commit + runner image.
      # KBUILD_BUILD_TIMESTAMP is exported to later steps via $GITHUB_ENV below.
      KBUILD_BUILD_USER: luofu-lane
      KBUILD_BUILD_HOST: github-actions
    steps:
      - uses: actions/checkout@v4

      - name: reproducible build stamp (the commit date)
        run: echo "KBUILD_BUILD_TIMESTAMP=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: cross toolchain + kernel build deps + mkimage
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf bc bison flex libssl-dev \
                                  u-boot-tools device-tree-compiler

      - name: reference DTS check (the repo's own recipe, upstream dtc)
        run: |
          # Independent of the kernel build: the same sources compiled by the
          # distro dtc, so a DTS/source regression shows up as its own failure.
          # (tools/dtc-check.sh is the host-side twin of this step; the DTS has
          # no #include, only #define, so plain cpp is enough.)
          mkdir -p out
          cpp -nostdinc -undef -x assembler-with-cpp docs/soc/luofu-r116.dts -o out/luofu-r116.pp.dts
          dtc -I dts -O dtb -o out/luofu-r116.ref.dtb out/luofu-r116.pp.dts
          ls -l out/luofu-r116.ref.dtb
          sha256sum out/luofu-r116.ref.dtb

      - name: kernel source (vanilla 5.10.201)
        run: |
          curl -sSLo linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.201.tar.xz
          tar xf linux.tar.xz

      - name: inject our machine + devicetree + the Kconfig/Makefile wiring
        run: |
          cd linux-5.10.201
          # the three in-tree edits (ARCH_LUOFU under the Hisilicon platform menu,
          # the machine- hook, our dtb in the dtbs build) - dry-run first so a
          # drifted upstream file fails loudly instead of half-applying.
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/lab/luofu-kernel/kernel-tree.patch"
          patch -p1           < "$GITHUB_WORKSPACE/lab/luofu-kernel/kernel-tree.patch"
          # the instrumented head files are copied whole:
          cp "$GITHUB_WORKSPACE/lab/luofu-kernel/patched-head.S"        arch/arm/kernel/head.S
          cp "$GITHUB_WORKSPACE/lab/luofu-kernel/patched-head-common.S" arch/arm/kernel/head-common.S
          # the new files are copied, not patched: docs/soc/luofu-r116.dts stays
          # the single source of truth for the devicetree.
          cp -r "$GITHUB_WORKSPACE/lab/luofu-kernel/mach-luofu" arch/arm/mach-luofu
          cp "$GITHUB_WORKSPACE/docs/soc/luofu-r116.dts" arch/arm/boot/dts/luofu-r116.dts
          ls -l arch/arm/mach-luofu/
          grep -n 'ARCH_LUOFU' arch/arm/mach-hisi/Kconfig arch/arm/Makefile arch/arm/boot/dts/Makefile

      - name: configure (vanilla base + the fragment)
        run: |
          cd linux-5.10.201
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- multi_v7_defconfig
          cp .config .config.base
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          # luofu.fragment = the port's inventory; luofu-shrink.fragment = the
          # kernelb size budget (see that file's header for the rationale).
          scripts/kconfig/merge_config.sh -m .config \
            "$GITHUB_WORKSPACE/lab/luofu-kernel/luofu.fragment" \
            "$GITHUB_WORKSPACE/lab/luofu-kernel/luofu-shrink.fragment"
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          diff -u .config.base .config > luofu-config-delta.txt || true

      - name: assert the image's load-bearing symbols
        run: |
          cd linux-5.10.201
          fail=0
          # The shrink must not take the machine, the ARM core, the console, the
          # storage/mount path, the pstore pair, PCIe or the wifi stack with it.
          for sym in CONFIG_ARCH_HISI CONFIG_ARCH_LUOFU CONFIG_ARCH_MULTIPLATFORM \
                     CONFIG_ARCH_MULTI_V7 CONFIG_SMP CONFIG_COMMON_CLK CONFIG_CACHE_L2X0 \
                     CONFIG_ARM_GIC CONFIG_ARM_ARCH_TIMER CONFIG_HAVE_ARM_ARCH_TIMER \
                     CONFIG_VFP CONFIG_NEON CONFIG_HIGHMEM CONFIG_TMPFS CONFIG_STACKTRACE \
                     CONFIG_OF CONFIG_USE_OF CONFIG_SPARSE_IRQ CONFIG_IRQ_DOMAIN CONFIG_TIMER_OF \
                     CONFIG_SERIAL_8250 CONFIG_SERIAL_8250_CONSOLE CONFIG_SERIAL_8250_DW \
                     CONFIG_SERIAL_EARLYCON CONFIG_TTY CONFIG_UNIX98_PTYS \
                     CONFIG_MTD CONFIG_MTD_BLOCK CONFIG_MTD_OF_PARTS CONFIG_MTD_SPI_NAND \
                     CONFIG_MTD_UBI CONFIG_MTD_UBI_BLOCK CONFIG_SQUASHFS CONFIG_UBIFS_FS \
                     CONFIG_PSTORE CONFIG_PSTORE_CONSOLE CONFIG_PSTORE_RAM \
                     CONFIG_PCI CONFIG_PCI_MSI CONFIG_PCIEPORTBUS CONFIG_CFG80211 CONFIG_MAC80211 \
                     CONFIG_DEVTMPFS CONFIG_DEVTMPFS_MOUNT CONFIG_PROC_FS CONFIG_SYSFS \
                     CONFIG_BINFMT_ELF CONFIG_UNIX CONFIG_INET CONFIG_MODULES CONFIG_KALLSYMS \
                     CONFIG_CC_OPTIMIZE_FOR_SIZE CONFIG_I2C CONFIG_I2C_DESIGNWARE_PLATFORM \
                     CONFIG_SPI CONFIG_NETDEVICES CONFIG_PHYLIB CONFIG_MDIO_DEVICE CONFIG_GPIOLIB \
                     CONFIG_GPIO_DWAPB CONFIG_PINCTRL CONFIG_NEW_LEDS CONFIG_LEDS_CLASS \
                     CONFIG_LEDS_GPIO CONFIG_REGULATOR CONFIG_REGULATOR_PWM CONFIG_PWM \
                     CONFIG_WATCHDOG CONFIG_WATCHDOG_CORE CONFIG_THERMAL CONFIG_CPU_THERMAL \
                     CONFIG_NVMEM CONFIG_HW_RANDOM CONFIG_CRYPTO_JITTERENTROPY CONFIG_FW_LOADER; do
            if grep -qx "$sym=y" .config; then
              echo "  OK    $sym=y"
            else
              echo "  FAIL  $sym is not =y in the image config"
              fail=1
            fi
          done
          # ... and the fat the shrink drops must stay dropped, or it creeps back.
          for sym in CONFIG_BLK_DEV_INITRD CONFIG_VT CONFIG_INPUT CONFIG_USB_SUPPORT CONFIG_MMC \
                     CONFIG_DRM CONFIG_FB CONFIG_SCSI CONFIG_ATA CONFIG_HWMON CONFIG_NFS_FS \
                     CONFIG_XFS_FS CONFIG_BTRFS_FS CONFIG_F2FS_FS CONFIG_NETFILTER CONFIG_FTRACE \
                     CONFIG_PERF_EVENTS CONFIG_EFI CONFIG_ARCH_MVEBU CONFIG_ARCH_ROCKCHIP \
                     CONFIG_ARCH_SUNXI CONFIG_ARCH_TEGRA CONFIG_ARCH_EXYNOS CONFIG_ARCH_MXC \
                     CONFIG_ARCH_QCOM; do
            if grep -qx "$sym=y" .config; then
              echo "  FAIL  $sym came back (the shrink is not in effect)"
              fail=1
            else
              echo "  OK    $sym is off"
            fi
          done
          echo "--- the delta vs the vanilla multi_v7 base ---"
          echo "  added   : $(grep -cE '^\+CONFIG_[A-Za-z0-9_]+=' luofu-config-delta.txt || true) lines"
          echo "  removed : $(grep -cE '^-CONFIG_[A-Za-z0-9_]+=' luofu-config-delta.txt || true) lines"
          echo "  =y left : $(grep -cE '^CONFIG_[A-Za-z0-9_]+=y$' .config) (multi_v7 base: $(grep -cE '^CONFIG_[A-Za-z0-9_]+=y$' .config.base))"
          grep -E '^\+CONFIG_(ARCH_LUOFU|CLK_LUOFU|PINCTRL_LUOFU|PCIE_LUOFU|MTD_NAND_LUOFU|LUOFU_[A-Z0-9]+)=' luofu-config-delta.txt || true
          exit $fail

      - name: build zImage + our devicetree
        run: |
          cd linux-5.10.201
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j"$(nproc)" zImage
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- dtbs
          test -s arch/arm/boot/zImage
          test -s arch/arm/boot/dts/luofu-r116.dtb
          ls -l arch/arm/boot/zImage arch/arm/boot/dts/luofu-r116.dtb

      - name: pack the uImage (the kernel half of the kernelb slice)
        run: |
          cd linux-5.10.201
          # the vendor kernelb header: load = ep = 0x80608000, os=linux, arch=arm,
          # comp=none (a zImage is self-decompressing), name Linux-5.10.201
          # (build/tmp/inta-spec/kprep.md sec.1.2 item 6 / sec.3.2).
          mkimage -A arm -O linux -T kernel -C none -a 0x80608000 -e 0x80608000 \
                  -n Linux-5.10.201 -d arch/arm/boot/zImage luofu-uImage
          ls -l luofu-uImage

      - name: size audit (size(1)) + the kernelb budget - the gate
        run: |
          cd linux-5.10.201
          {
            echo "--- built-in kernel, size(1) of vmlinux ---"
            arm-linux-gnueabihf-size vmlinux
            echo
            echo "--- image sizes ---"
            for f in arch/arm/boot/Image arch/arm/boot/zImage luofu-uImage \
                     arch/arm/boot/dts/luofu-r116.dtb; do
              printf '%10s  %s\n' "$(stat -c %s "$f")" "$f"
            done
          } | tee luofu-size.txt
          uimg=$(stat -c %s luofu-uImage)
          dtb=$(stat -c %s arch/arm/boot/dts/luofu-r116.dtb)
          part=8650752                     # mtd12 kernelb (kprep.md sec.1.2 item 6)
          target=8400000                   # the margin target (<= ~8.4 MB)
          {
            echo
            echo "kernelb budget: uImage $uimg B vs the partition $part B"
            echo "full slice    : uImage $uimg B + our DTB $dtb B = $((uimg + dtb)) B of $part B"
            echo "margin        : $((part - uimg)) B on the uImage, $((part - uimg - dtb)) B on the slice"
            echo "vendor slice  : uImage 4294160 B + base DTB 31220 B + overlays 4592 + 4920 B = 4334892 B"
            if [ "$uimg" -le "$part" ]; then
              echo "BUDGET: PASS - uImage $uimg B <= $part B"
            else
              echo "BUDGET: FAIL - uImage $uimg B > $part B by $((uimg - part)) B"
            fi
          } | tee -a luofu-size.txt
          if [ "$uimg" -gt "$part" ]; then
            echo "::error title=the image does not fit kernelb::uImage $uimg B against the $part B partition - the flash would not run"
            exit 1
          fi
          if [ "$uimg" -gt "$target" ]; then
            echo "::warning title=over the 8.4 MB target::uImage is $uimg B, the target is <= $target B"
          fi

      - name: stage the artifact set (flat) + manifest (sizes + sha256)
        run: |
          cd linux-5.10.201
          rm -rf out && mkdir -p out
          cp arch/arm/boot/zImage               out/zImage
          cp arch/arm/boot/dts/luofu-r116.dtb   out/luofu-r116.dtb
          cp luofu-uImage                       out/luofu-uImage
          cp luofu-config-delta.txt             out/luofu-config-delta.txt
          cp luofu-size.txt                     out/luofu-slice.txt
          # named luofu-image.config, not .config: upload-artifact skips dotfiles
          cp .config                            out/luofu-image.config
          cp "$GITHUB_WORKSPACE/out/luofu-r116.ref.dtb" out/luofu-r116.ref.dtb
          {
            echo "# luofu kernel image lane"
            echo "# commit: $GITHUB_SHA"
            echo "# base:   linux-5.10.201 multi_v7_defconfig + lab/luofu-kernel/luofu.fragment + lab/luofu-kernel/kernel-tree.patch"
            echo "# built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# stamp:  KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
            # explicit list: a glob would also hash the MANIFEST being written
            for f in out/zImage out/luofu-r116.dtb out/luofu-uImage out/luofu-image.config \
                     out/luofu-r116.ref.dtb out/luofu-config-delta.txt out/luofu-slice.txt; do
              printf '%10s  %s  %s\n' "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
            done
          } | tee out/MANIFEST.txt
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: luofu-kernel-image
          path: linux-5.10.201/out
